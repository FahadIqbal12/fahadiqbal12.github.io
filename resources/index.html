<!DOCTYPE html>
<html>

<head>
    <title>Files</title>
</head>

<body>
    <h1>Files in resources</h1>
    <ul id="file-list"></ul>
    <script>
        (async () => {
            const response = await fetch('https://api.github.com/repos/FahadIqbal12/fahadiqbal12.github.io/contents/resources');
            const data = await response.json();
            const ul = document.getElementById('file-list');
            for (const file of data) {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = file.name.slice(0, -3);
                a.textContent = file.type === 'dir' ? file.name + '/' : file.name;
                li.appendChild(a);
                ul.appendChild(li);
            }
        })();
    </script>
</body>

</html>
